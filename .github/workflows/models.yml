name: Build the models

# Converts the original model files (from their authors' GitHub releases) to ONNX for the phone, and publishes them
# as a release. Run by hand (Actions → Build the models → Run workflow) or on a push that changes tools/.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "tools/**", ".github/workflows/models.yml" ]

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q onnx onnxruntime onnxconverter-common einops timm numpy
      - name: Original weights
        run: |
          mkdir -p weights && cd weights
          curl -fsSLO https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          curl -fsSLO https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -fsSLO https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth
          curl -fsSLO https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
          curl -fsSLO https://github.com/cszn/KAIR/releases/download/v1.0/scunet_color_real_psnr.pth
          curl -fsSL -o Epoch99.pth https://raw.githubusercontent.com/Li-Chongyi/Zero-DCE_extension/main/Zero-DCE%2B%2B/snapshots_Zero_DCE%2B%2B/Epoch99.pth
          ls -la
      - name: Convert
        run: python tools/export.py onnx weights
      - name: Check they run
        run: python tools/check.py onnx
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-${{ github.run_number }}
          name: Models ${{ github.run_number }}
          body: "AI models for BunnyEdit (ONNX). See README for what each one is and its license."
          files: onnx/*.onnx
          make_latest: true
